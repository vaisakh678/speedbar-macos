name: Speedbar

options:
  bundleIdPrefix: com.cortexlumora
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Speedbar:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cortexlumora.Speedbar
        PRODUCT_NAME: Speedbar
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Speedbar.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad-hoc signing so the app builds and runs locally with no Apple account.
        # For distribution, swap to: CODE_SIGN_STYLE: Automatic + DEVELOPMENT_TEAM: KTJUU8D53Q
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
