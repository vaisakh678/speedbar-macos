name: Wirespeed

options:
  bundleIdPrefix: com.cortexlumora
  # Stamps LastUpgradeCheck. Without it XcodeGen emits an old value and Xcode
  # offers "Update to recommended settings" on every open — an offer that is
  # pointless here, since accepting it edits the generated .xcodeproj and the
  # next `xcodegen generate` throws the change away.
  xcodeVersion: "27.0"
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Wirespeed:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cortexlumora.Wirespeed
        PRODUCT_NAME: Wirespeed
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Wirespeed.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Ad-hoc signing keeps day-to-day builds working with no certificate
        # installed. Nothing here can be distributed, which is the point.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
        # Release lets Xcode manage the certificate and provisioning profile.
        # Hand-picking a profile means first creating a CSR, then a Mac App
        # Distribution certificate, then a profile bound to both — all of which
        # Xcode does itself when signing is automatic.
        Release:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: KTJUU8D53Q
